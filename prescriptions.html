{% extends "base.html" %}{% block content %}
<h2>Digital Prescriptions</h2>
<form method="post" class="card p-3 shadow-sm mb-4"><div class="row g-2">
<div class="col-md-3"><select class="form-select" name="patient_id" required><option value="">Patient</option>{% for p in patients %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></div>
<div class="col-md-3"><select class="form-select" name="doctor_id" required><option value="">Doctor</option>{% for d in doctors %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select></div>
<div class="col-md-3"><input class="form-control" name="medicine" placeholder="Medicine" required></div><div class="col-md-3"><input class="form-control" name="dosage" placeholder="Dosage"></div>
<div class="col-md-10"><input class="form-control" name="notes" placeholder="Notes / instructions"></div><div class="col-md-2"><button class="btn btn-primary w-100">Save</button></div></div></form>
<div class="card shadow-sm table-responsive"><table class="table mb-0"><thead><tr><th>Patient</th><th>Doctor</th><th>Medicine</th><th>Dosage</th><th>Notes</th></tr></thead>
<tbody>{% for r in prescriptions %}<tr><td>{{r.patient}}</td><td>{{r.doctor}}</td><td>{{r.medicine}}</td><td>{{r.dosage}}</td><td>{{r.notes}}</td></tr>{% else %}<tr><td colspan="5" class="text-center p-4">No prescriptions yet.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
