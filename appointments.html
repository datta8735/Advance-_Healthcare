{% extends "base.html" %}{% block content %}
<h2>Appointment Scheduling</h2>
<form method="post" class="card p-3 shadow-sm mb-4"><div class="row g-2">
<div class="col-md-3"><select class="form-select" name="patient_id" required><option value="">Patient</option>{% for p in patients %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></div>
<div class="col-md-3"><select class="form-select" name="doctor_id" required><option value="">Doctor</option>{% for d in doctors %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select></div>
<div class="col-md-2"><input class="form-control" type="date" name="date" required></div><div class="col-md-2"><input class="form-control" type="time" name="time" required></div>
<div class="col-md-2"><button class="btn btn-primary w-100">Schedule</button></div></div></form>
<div class="card shadow-sm table-responsive"><table class="table mb-0"><thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
<tbody>{% for a in appointments %}<tr><td>{{a.id}}</td><td>{{a.patient}}</td><td>{{a.doctor}}</td><td>{{a.date}}</td><td>{{a.time}}</td><td><span class="badge bg-success">{{a.status}}</span></td></tr>{% else %}<tr><td colspan="6" class="text-center p-4">No appointments yet.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
