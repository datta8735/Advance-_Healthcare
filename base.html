<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advanced Healthcare System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
<div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🏥 Advanced Healthcare</a>
<div class="navbar-nav ms-auto">
<a class="nav-link" href="{{ url_for('patients') }}">Patients</a>
<a class="nav-link" href="{{ url_for('doctors') }}">Doctors</a>
<a class="nav-link" href="{{ url_for('appointments') }}">Appointments</a>
<a class="nav-link" href="{{ url_for('prescriptions') }}">Prescriptions</a>
</div></div></nav>
<main class="container py-4">
{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer class="text-center text-muted py-4">Advanced Healthcare System • Flask</footer>
</body></html>
